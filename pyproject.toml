[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lilac"
version = "0.1.0"
description = "An interpretable olfactory map: molecules -> a 40-bit 'nose' -> per-flavor signatures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# The 2-D map uses UMAP if present, otherwise falls back to t-SNE (scikit-learn).
map = ["umap-learn>=0.5"]
# Phase 2 learned refinement.
learn = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
